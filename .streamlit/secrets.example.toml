# Plantilla de .streamlit/secrets.toml. Este archivo sí se sube al repositorio;
# secrets.toml no (está en .gitignore).
#
# En local: copia este archivo como .streamlit/secrets.toml y pon tus valores.
# En Streamlit Community Cloud: pega el contenido, con tus valores, en el
# campo "Secrets" de la app.
# En Docker: monta tu secrets.toml como volumen (ver README).

# --- Groq ---
# app.py copia estas tres claves a variables de entorno al arrancar.
GROQ_API_KEY = "pega_aqui_tu_clave"
GROQ_MODEL = "openai/gpt-oss-120b"
GROQ_MODEL_REVISOR = "qwen/qwen3.8-27b"

# --- Cookie de la sesión ---
# Permite volver a entrar sin escribir la contraseña mientras no caduque.
# key firma la cookie: pon una cadena larga y aleatoria, distinta en cada
# entorno. Por ejemplo, la salida de:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
[cookie]
name = "la_redaccion_sesion"
key = "cambia_esto_por_una_cadena_larga_y_aleatoria"
expiry_days = 1

# --- Usuarios ---
# Un bloque por usuario. El nombre del bloque es el usuario con el que se
# entra (en minúsculas). La contraseña va cifrada: genérala con
#   python scripts/cifrar_contrasena.py
# y pega aquí el resultado. Nunca pongas la contraseña en claro.
[credentials.usernames.usuario_de_ejemplo]
name = "Nombre visible"
email = "usuario@example.com"
password = "$2b$12$pega.aqui.el.resultado.de.cifrar_contrasena.py"
